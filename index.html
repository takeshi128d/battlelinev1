<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRONTIER LINE - ONLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK (v8 互換モード) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto+Condensed:wght@700&display=swap');

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Roboto Condensed', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
        }

        /* --- カード共通 --- */
        .card {
            width: 52px;
            height: 78px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            position: relative;
            border-width: 2px;
            border-style: solid;
            background-size: cover;
            overflow: hidden;
            padding: 2px;
        }
        .card:active { transform: scale(0.95); }
        .card.selected {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.9);
            border-color: #facc15;
            z-index: 20;
        }
        .card.banned {
            filter: grayscale(100%) opacity(0.3);
            transform: scale(0.9);
            border-color: #333;
        }
        /* 裏面 */
        .card.back {
            background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #334155 10px, #334155 20px);
            border-color: #475569;
            cursor: default;
        }
        
        .card.color-0 { background: linear-gradient(135deg, #450a0a, #7f1d1d); border-color: #f87171; color: #fecaca; }
        .card.color-1 { background: linear-gradient(135deg, #052e16, #14532d); border-color: #4ade80; color: #bbf7d0; }
        .card.color-2 { background: linear-gradient(135deg, #172554, #1e3a8a); border-color: #60a5fa; color: #bfdbfe; }
        .card.color-3 { background: linear-gradient(135deg, #451a03, #b45309); border-color: #fbbf24; color: #fef3c7; }

        .card-num { font-size: 1.3rem; line-height: 1; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
        .card-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.2; font-size: 2.5rem; pointer-events: none; }
        .card-corner-icon { font-size: 0.7rem; }
        
        /* 盤面用カード */
        .card-sm { width: 40px; height: 58px; border-width: 1px; margin: -6px 0; }
        .card-sm .card-num { font-size: 1.0rem; }

        /* レーン */
        .lane-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .lane-container.highlight {
            background: rgba(251, 191, 36, 0.15);
            cursor: pointer;
        }

        /* フラッグ */
        .flag-marker {
            width: 32px; height: 32px; border-radius: 4px; background: #1e293b; border: 2px solid #475569;
            display: flex; align-items: center; justify-content: center; font-size: 0.9rem; z-index: 5;
            transition: all 0.4s;
        }
        .flag-marker.p1-win { background: #2563eb; border-color: #60a5fa; transform: translateY(24px) rotate(-10deg) scale(1.2); color: white; box-shadow: 0 0 10px #2563eb; }
        .flag-marker.p2-win { background: #dc2626; border-color: #f87171; transform: translateY(-24px) rotate(10deg) scale(1.2); color: white; box-shadow: 0 0 10px #dc2626; }

        /* オーバーレイ */
        #overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        input { background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 4px; text-align: center; font-size: 1.2rem; outline: none; }
        input:focus { border-color: #facc15; }

        /* Ban画面グリッド */
        #ban-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            max-width: 95vw;
            margin: 10px;
            overflow-y: auto;
            max-height: 50vh;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col">

    <!-- オーバーレイ (ロビー/Ban/メッセージ) -->
    <div id="overlay">
        <h1 class="text-4xl font-bold mb-2 text-yellow-500" style="font-family: 'Cinzel'">FRONTIER LINE</h1>
        <p class="text-gray-400 mb-8 text-xs tracking-widest">ONLINE MULTIPLAYER</p>
        
        <!-- ロビー画面 -->
        <div id="screen-lobby" class="text-center w-full max-w-sm px-4">
            <div class="mb-6">
                <p class="mb-2 text-sm text-gray-300">合言葉(Room ID)を入力してください</p>
                <input type="text" id="room-id-input" placeholder="例: battle123" class="w-full mb-2 uppercase">
                <p class="text-xs text-gray-500">※同じ合言葉の人とマッチングします</p>
            </div>
            
            <div id="firebase-warning" class="hidden text-red-400 text-xs mb-4 border border-red-900 p-2 rounded bg-red-900/20">
                ⚠️ エラー: データベースに接続できません。<br>Firebaseコンソールで「Firestore Database」を作成し、ルールを「テストモード」に設定してください。
            </div>

            <button onclick="tryJoinRoom()" id="btn-join" class="w-full px-6 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded shadow-lg transition">
                ENTER ROOM
            </button>
        </div>

        <!-- 待機画面 -->
        <div id="screen-wait" class="text-center hidden">
            <div class="animate-spin text-4xl mb-4">⚔️</div>
            <h2 class="text-2xl font-bold mb-2 text-white">WAITING...</h2>
            <p class="text-gray-400 text-sm">通信待機中<br>Room ID: <span id="display-room-id" class="text-yellow-400 font-mono"></span></p>
        </div>

        <!-- Ban画面 (除外カード選択) -->
        <div id="screen-ban" class="text-center hidden w-full flex flex-col items-center">
            <h2 class="text-2xl text-red-400 font-bold mb-2" style="font-family: 'Cinzel'">TACTICAL BAN</h2>
            <p class="text-gray-300 text-sm mb-2">この対戦から除外するカードを<span class="text-red-400 font-bold">2枚</span>選択してください。<br>(相手には通知されません)</p>
            
            <div id="ban-grid" class="p-2 border border-slate-700 bg-slate-800 rounded">
                <!-- 全カード一覧 -->
            </div>
            
            <div class="mt-4 flex gap-4 items-center mb-4">
                <div class="text-xl font-bold" id="ban-count">0 / 2</div>
                <button id="btn-confirm-ban" onclick="submitBan()" disabled class="px-8 py-2 bg-gray-700 text-gray-400 font-bold rounded border border-gray-600 transition">
                    CONFIRM
                </button>
            </div>
        </div>

        <!-- メッセージ画面 (勝敗など) -->
        <div id="screen-msg" class="text-center hidden">
            <h2 id="msg-title" class="text-5xl font-bold mb-4"></h2>
            <p id="msg-sub" class="mb-8 text-gray-300 text-xl"></p>
            <button onclick="location.reload()" class="px-10 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded">
                LEAVE ROOM
            </button>
        </div>
    </div>

    <!-- ゲームエリア -->
    <div class="flex-1 flex flex-col max-w-md mx-auto w-full relative border-x border-slate-800 bg-slate-900 shadow-2xl">
        
        <!-- 上部：相手エリア -->
        <div class="h-28 bg-slate-800 flex items-center justify-between px-4 border-b border-slate-700">
            <div>
                <div class="text-xs text-red-500 font-bold tracking-widest">OPPONENT</div>
                <div class="flex gap-1 mt-2" id="p2-hand-view">
                    <!-- 相手の手札(裏面) -->
                </div>
            </div>
            <div class="text-right">
                <div class="text-xs text-slate-500 tracking-widest">DECK</div>
                <div class="text-2xl font-bold font-serif text-slate-400" id="deck-count">--</div>
            </div>
        </div>

        <!-- 中央：盤面 -->
        <div class="flex-1 grid grid-cols-5 gap-0 relative" id="board-area" 
             style="background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px;">
            <!-- レーン生成 -->
        </div>

        <!-- 下部：自分エリア -->
        <div class="h-44 bg-slate-900 border-t border-slate-700 flex flex-col justify-end pb-2 relative">
            <div class="flex justify-between px-4 mb-2">
                <div class="text-xs text-blue-400 font-bold tracking-widest" id="turn-indicator">--</div>
                <div class="text-xs text-yellow-500" id="game-status">--</div>
            </div>
            <div class="flex justify-center items-end gap-2 px-2 h-28" id="p1-hand-view">
                <!-- 自分の手札 -->
            </div>
        </div>
    </div>

<script>
/**
 * ------------------------------------------------------------
 * FIREBASE CONFIGURATION (設定済み)
 * ------------------------------------------------------------
 */
const firebaseConfig = {
  apiKey: "AIzaSyDAff48sH10URJZiv2IHJvw0qWS3GTOymQ",
  authDomain: "game-3b358.firebaseapp.com",
  projectId: "game-3b358",
  storageBucket: "game-3b358.firebasestorage.app",
  messagingSenderId: "601253776534",
  appId: "1:601253776534:web:bfe53692c87a5fe8bc06b7",
  measurementId: "G-T7T38LQLKD"
};

// --- グローバル変数 ---
let db;
let myPlayerId = null; // 1 (Host/P1) or -1 (Guest/P2)
let currentRoomId = null;
let unsubscribe = null; // Firestore listener

// ゲーム定数
const COLORS = [
    { id: 0, color: '#f87171', icon: '⚔️' },
    { id: 1, color: '#4ade80', icon: '🏹' },
    { id: 2, color: '#60a5fa', icon: '🪄' },
    { id: 3, color: '#fbbf24', icon: '🛡️' }
];
const MAX_VAL = 12;
const HAND_SIZE = 6;
const LANE_COUNT = 5;
const BAN_COUNT = 2; // 各自2枚除外

// ゲーム状態 (DB同期対象)
let gameState = {
    status: 'waiting', // waiting, banning, playing, finished
    p1Bans: null,      // P1が除外したカードIDリスト
    p2Bans: null,      // P2が除外したカードIDリスト
    deck: [],
    p1Hand: [], 
    p2Hand: [], 
    lanes: [], 
    turn: 1, 
    winner: null,
    lastUpdate: 0
};

// ローカル状態
let selectedHandIdx = -1;
let mySelectedBans = [];
let fullDeckForBan = [];

/**
 * 初期化とFirebase接続チェック
 */
function initApp() {
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        console.log("Firebase Initialized");
        
        // Ban画面用にフルデッキ情報を生成
        fullDeckForBan = [];
        for(let c=0; c<COLORS.length; c++) {
            for(let v=1; v<=MAX_VAL; v++) {
                fullDeckForBan.push({ color: c, value: v, id: `${c}-${v}` });
            }
        }
    } catch (e) {
        console.warn("Firebase Config Error:", e);
        showError("Firebaseの設定エラーです。");
    }
}

function showError(msg) {
    const el = document.getElementById('firebase-warning');
    el.innerHTML = "⚠️ " + msg;
    el.classList.remove('hidden');
}

/**
 * マッチングロジック
 */
async function tryJoinRoom() {
    const roomInput = document.getElementById('room-id-input').value.toUpperCase();
    if (!roomInput) return;
    if (!db) {
        showError("データベースに接続されていません。");
        return;
    }
    
    currentRoomId = roomInput;
    document.getElementById('display-room-id').innerText = currentRoomId;

    const docRef = db.collection('rooms').doc(currentRoomId);
    document.getElementById('btn-join').innerText = "CONNECTING...";
    document.getElementById('btn-join').disabled = true;

    try {
        await db.runTransaction(async (transaction) => {
            const doc = await transaction.get(docRef);

            if (!doc.exists) {
                // ホスト(P1)として作成
                myPlayerId = 1;
                const initialState = createInitialState();
                transaction.set(docRef, initialState);
            } else {
                const data = doc.data();
                if (data.status === 'waiting') {
                    // ゲスト(P2)として参加 -> 即座にBanフェーズへ移行
                    myPlayerId = -1;
                    transaction.update(docRef, { 
                        status: 'banning',
                        lastUpdate: Date.now() 
                    });
                } else {
                    throw "Room is full";
                }
            }
        });

        startListening();

    } catch (error) {
        if(error === "Room is full") {
            alert("その部屋は既に満員か、対戦中です。");
        } else {
            console.error(error);
            showError("接続失敗: Firestoreが無効か、設定が必要です。");
        }
        document.getElementById('btn-join').innerText = "ENTER ROOM";
        document.getElementById('btn-join').disabled = false;
    }
}

function startListening() {
    unsubscribe = db.collection('rooms').doc(currentRoomId)
        .onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                gameState = data;
                onGameStateChanged();
            }
        });
}

function onGameStateChanged() {
    // 状態に応じた画面遷移
    if (gameState.status === 'waiting') {
        showScreen('wait');
        document.querySelector('#screen-wait h2').innerText = "WAITING FOR P2...";
    } 
    else if (gameState.status === 'banning') {
        // Banフェーズ: まだBanを送信していないならBan画面、送信済みなら待機画面
        if (myPlayerId === 1 && !gameState.p1Bans) {
            setupBanScreen();
        } else if (myPlayerId === -1 && !gameState.p2Bans) {
            setupBanScreen();
        } else {
            showScreen('wait');
            document.querySelector('#screen-wait h2').innerText = "OPPONENT CHOOSING...";
        }

        // 両者のBanが揃っている場合、ホスト(P1)がゲームを開始する処理を走らせる
        if (myPlayerId === 1 && gameState.p1Bans && gameState.p2Bans) {
            startGameWithBans();
        }
    }
    else if (gameState.status === 'playing') {
        document.getElementById('overlay').style.display = 'none';
        updateGameUI();
    } 
    else if (gameState.status === 'finished') {
        document.getElementById('overlay').style.display = 'flex';
        showResult();
    }
}

/**
 * 初期データ構造
 */
function createInitialState() {
    // レーンのみ初期化（デッキはBan後に生成）
    const lanes = [];
    for(let i=0; i<LANE_COUNT; i++) {
        lanes.push({ p1Cards: [], p2Cards: [], winner: 0 });
    }

    return {
        status: 'waiting',
        p1Bans: null,
        p2Bans: null,
        deck: [],
        p1Hand: [], p2Hand: [],
        lanes,
        turn: 1, 
        winner: null,
        lastUpdate: Date.now()
    };
}

/**
 * Ban画面ロジック
 */
function setupBanScreen() {
    showScreen('ban');
    const grid = document.getElementById('ban-grid');
    grid.innerHTML = '';
    mySelectedBans = [];
    updateBanBtn();

    fullDeckForBan.forEach(card => {
        const el = createCardEl(card, true);
        el.style.transform = "scale(0.8)";
        el.style.width = "40px";
        el.style.height = "60px";
        el.onclick = () => toggleBanSelection(card.id, el);
        grid.appendChild(el);
    });
}

function toggleBanSelection(id, el) {
    const idx = mySelectedBans.indexOf(id);
    if (idx >= 0) {
        mySelectedBans.splice(idx, 1);
        el.classList.remove('banned');
    } else {
        if (mySelectedBans.length < BAN_COUNT) {
            mySelectedBans.push(id);
            el.classList.add('banned');
        }
    }
    updateBanBtn();
}

function updateBanBtn() {
    const count = mySelectedBans.length;
    document.getElementById('ban-count').innerText = `${count} / ${BAN_COUNT}`;
    const btn = document.getElementById('btn-confirm-ban');
    if (count === BAN_COUNT) {
        btn.disabled = false;
        btn.classList.remove('bg-gray-700', 'text-gray-400');
        btn.classList.add('bg-red-600', 'text-white');
    } else {
        btn.disabled = true;
        btn.classList.add('bg-gray-700', 'text-gray-400');
        btn.classList.remove('bg-red-600', 'text-white');
    }
}

async function submitBan() {
    // DBに自分のBanリストを送信
    const updateData = {};
    if (myPlayerId === 1) updateData.p1Bans = mySelectedBans;
    else updateData.p2Bans = mySelectedBans;
    updateData.lastUpdate = Date.now();

    await db.collection('rooms').doc(currentRoomId).update(updateData);
    // 画面は onGameStateChanged で待機画面に切り替わる
}

/**
 * ゲーム開始処理 (Ban情報をもとにデッキ構築)
 */
async function startGameWithBans() {
    // ホスト(P1)のみが実行
    const allBans = [...gameState.p1Bans, ...gameState.p2Bans];
    
    // デッキ生成
    let deck = fullDeckForBan.filter(c => !allBans.includes(c.id));
    
    // シャッフル
    for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
    }

    // 手札配布
    const p1Hand = [];
    const p2Hand = [];
    for(let i=0; i<HAND_SIZE; i++) {
        if(deck.length) p1Hand.push(deck.pop());
        if(deck.length) p2Hand.push(deck.pop());
    }

    await db.collection('rooms').doc(currentRoomId).update({
        status: 'playing',
        deck,
        p1Hand,
        p2Hand,
        lastUpdate: Date.now()
    });
}

/**
 * ゲームプレイロジック
 */
function playCard(cardIdx, laneIdx) {
    if (gameState.turn !== myPlayerId) return; 
    
    const myHand = myPlayerId === 1 ? gameState.p1Hand : gameState.p2Hand;
    const lane = gameState.lanes[laneIdx];
    const targetArr = myPlayerId === 1 ? lane.p1Cards : lane.p2Cards;

    if (targetArr.length >= 3 || lane.winner !== 0) return;

    const card = myHand.splice(cardIdx, 1)[0];
    targetArr.push(card);

    if (gameState.deck.length > 0) {
        myHand.push(gameState.deck.pop());
    }

    checkLaneOutcome(lane);

    if (checkGameEnd()) {
        gameState.status = 'finished';
    } else {
        gameState.turn *= -1;
    }

    gameState.lastUpdate = Date.now();
    
    selectedHandIdx = -1;
    db.collection('rooms').doc(currentRoomId).set(gameState);
}

// 役判定
function getHandRank(cards) {
    if (cards.length < 3) return { rank: 0, score: 0 };
    const sorted = [...cards].sort((a, b) => a.value - b.value);
    const v = sorted.map(c => c.value);
    const c = sorted.map(c => c.color);
    
    const isFlush = c[0] === c[1] && c[1] === c[2];
    const isStraight = (v[0] + 1 === v[1] && v[1] + 1 === v[2]);
    const isTriple = (v[0] === v[1] && v[1] === v[2]);
    const sum = v.reduce((a, b) => a + b, 0);

    if (isFlush && isStraight) return { rank: 5, score: sum };
    if (isTriple) return { rank: 4, score: sum };
    if (isFlush) return { rank: 3, score: sum };
    if (isStraight) return { rank: 2, score: sum };
    return { rank: 1, score: sum };
}

function checkLaneOutcome(lane) {
    if (lane.p1Cards.length === 3 && lane.p2Cards.length === 3) {
        const r1 = getHandRank(lane.p1Cards);
        const r2 = getHandRank(lane.p2Cards);

        if (r1.rank > r2.rank) lane.winner = 1;
        else if (r2.rank > r1.rank) lane.winner = -1;
        else {
            if (r1.score > r2.score) lane.winner = 1;
            else if (r2.score > r1.score) lane.winner = -1;
            else lane.winner = 1; 
        }
    }
}

function checkGameEnd() {
    let p1 = 0, p2 = 0;
    gameState.lanes.forEach(l => {
        if (l.winner === 1) p1++;
        if (l.winner === -1) p2++;
    });
    if (p1 >= 3) { gameState.winner = 1; return true; }
    if (p2 >= 3) { gameState.winner = -1; return true; }
    if (gameState.lanes.every(l => l.winner !== 0)) {
        gameState.winner = (p1 > p2) ? 1 : -1;
        return true;
    }
    return false;
}

/**
 * 画面描画
 */
function updateGameUI() {
    const boardEl = document.getElementById('board-area');
    const p1HandEl = document.getElementById('p1-hand-view');
    const p2HandEl = document.getElementById('p2-hand-view');
    const turnEl = document.getElementById('turn-indicator');
    const statusEl = document.getElementById('game-status');

    const isMyTurn = gameState.turn === myPlayerId;
    turnEl.innerText = isMyTurn ? "YOUR TURN" : "OPPONENT'S TURN";
    turnEl.className = isMyTurn ? "text-xs text-blue-400 font-bold" : "text-xs text-red-400 font-bold";
    statusEl.innerText = isMyTurn ? (selectedHandIdx === -1 ? "CHOOSE CARD" : "SELECT LANE") : "WAITING...";
    statusEl.className = isMyTurn ? "text-xs text-yellow-500 animate-pulse" : "text-xs text-gray-500";

    document.getElementById('deck-count').innerText = gameState.deck.length;

    boardEl.innerHTML = '';
    gameState.lanes.forEach((lane, i) => {
        const container = document.createElement('div');
        container.className = 'lane-container group';
        if (isMyTurn && selectedHandIdx !== -1 && lane.winner === 0) {
            const myLaneCnt = myPlayerId === 1 ? lane.p1Cards.length : lane.p2Cards.length;
            if (myLaneCnt < 3) {
                container.classList.add('highlight');
                container.onclick = () => playCard(selectedHandIdx, i);
            }
        }

        const myCards = myPlayerId === 1 ? lane.p1Cards : lane.p2Cards;
        const opCards = myPlayerId === 1 ? lane.p2Cards : lane.p1Cards;
        
        const topDiv = document.createElement('div');
        topDiv.className = 'flex-1 flex flex-col justify-start items-center pt-2 gap-1 w-full';
        opCards.forEach(c => topDiv.appendChild(createCardEl(c, true)));

        const centerDiv = document.createElement('div');
        centerDiv.className = 'h-10 flex items-center justify-center w-full';
        const flag = document.createElement('div');
        flag.className = 'flag-marker';
        flag.innerHTML = `<span class="opacity-30 text-xs">${i+1}</span>`;
        if (lane.winner !== 0) {
            const isWin = lane.winner === myPlayerId;
            flag.classList.add(isWin ? 'p1-win' : 'p2-win');
            flag.innerText = isWin ? 'YOU' : 'OPP';
        }
        centerDiv.appendChild(flag);

        const bottomDiv = document.createElement('div');
        bottomDiv.className = 'flex-1 flex flex-col justify-end items-center pb-2 gap-1 w-full';
        myCards.forEach(c => bottomDiv.appendChild(createCardEl(c, true)));

        container.appendChild(topDiv);
        container.appendChild(centerDiv);
        container.appendChild(bottomDiv);
        boardEl.appendChild(container);
    });

    p1HandEl.innerHTML = '';
    const myHand = myPlayerId === 1 ? gameState.p1Hand : gameState.p2Hand;
    myHand.forEach((c, idx) => {
        const el = createCardEl(c, false);
        if (idx === selectedHandIdx) el.classList.add('selected');
        if (isMyTurn) {
            el.onclick = () => {
                selectedHandIdx = (selectedHandIdx === idx) ? -1 : idx;
                updateGameUI(); 
            };
        }
        p1HandEl.appendChild(el);
    });

    p2HandEl.innerHTML = '';
    const opHandSize = (myPlayerId === 1 ? gameState.p2Hand : gameState.p1Hand).length;
    for(let i=0; i<opHandSize; i++) {
        const back = document.createElement('div');
        back.className = 'w-6 h-9 bg-slate-700 border border-slate-600 rounded m-0.5 shadow-sm';
        p2HandEl.appendChild(back);
    }
}

function createCardEl(card, isSmall) {
    const el = document.createElement('div');
    el.className = `card color-${card.color} ${isSmall ? 'card-sm' : ''}`;
    el.innerHTML = `<div class="card-num">${card.value}</div><div class="card-icon">${COLORS[card.color].icon}</div>`;
    return el;
}

function showResult() {
    showScreen('msg');
    const isWin = gameState.winner === myPlayerId;
    const titleEl = document.getElementById('msg-title');
    titleEl.innerText = isWin ? "VICTORY!" : "DEFEAT...";
    titleEl.className = isWin ? "text-5xl font-bold mb-4 text-blue-500" : "text-5xl font-bold mb-4 text-red-500";
    document.getElementById('msg-sub').innerText = "ゲームが終了しました";
}

function showScreen(id) {
    ['screen-lobby', 'screen-wait', 'screen-ban', 'screen-msg'].forEach(s => document.getElementById(s).classList.add('hidden'));
    document.getElementById('screen-' + id).classList.remove('hidden');
}

// 開始
initApp();
</script>
</body>
</html>
